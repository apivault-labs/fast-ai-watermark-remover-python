[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-fast-ai-watermark-remover"
version = "0.1.0"
description = "Python client for AI Watermark Remover on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "fast", "ai", "watermark", "remover"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/fast-ai-watermark-remover"
Source = "https://github.com/apivault-labs/fast-ai-watermark-remover-python"
Documentation = "https://github.com/apivault-labs/fast-ai-watermark-remover-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_fast_ai_watermark_remover*"]
